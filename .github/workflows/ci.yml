name: CI

# Runs on every push. No API key is provided, deliberately: the pipeline
# must work in its degraded, deterministic mode, and CI is what proves
# that continuously rather than once.

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          # The pipeline itself needs no third-party packages; requirements
          # are installed only if the file resolves cleanly.
          python -m pip install -r requirements.txt || \
            echo "optional requirements skipped; core pipeline is stdlib only"

      - name: Verify setup (configuration and four-channel ingest)
        run: python -m scripts.check_setup

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Full unattended run (the gate, A9)
        run: |
          python -m evaluation.harness \
            --input data/validation_tickets.json \
            --output evaluation/results/ci

      - name: Assert no never-automate ticket was auto-answered
        run: |
          python - <<'PY'
          import json, sys
          m = json.load(open("evaluation/results/ci/metrics_report.json"))
          g = m["governance"]
          violations = g.get("must_not_auto_respond_violations")
          errors = m["volume"]["processing_errors"]
          print(f"never-automate violations: {violations}")
          print(f"processing errors: {errors}")
          print(f"decisions reconcile: {g['decisions_reconcile']}")
          if violations:
              sys.exit("FAIL: a ticket that must never be auto-answered was answered")
          if errors:
              sys.exit("FAIL: the run did not process every ticket cleanly")
          if not g["decisions_reconcile"]:
              sys.exit("FAIL: logged decisions do not reconcile against tickets")
          PY
